dataset:
  train:
    _base_: cfgs/dataset/TreeDataset.yaml
    others:
      K_FOLDS: 1
      bs: 16
      subset: train
  val:
    _base_: cfgs/dataset/TreeDataset.yaml
    others:
      K_FOLDS: 1
      bs: 16
      subset: val
grad_norm_clip: 10
max_epoch: 250
model:
  NAME: PointMLPElite
  activation: relu
  bias: false
  channels: 3
  dim_expansion:
  - 2
  - 2
  - 2
  - 1
  dropout: 0.5
  embed_dim: 32
  groups: 1
  k_neighbors:
  - 24
  - 24
  - 24
  - 24
  label_smoothing: 0.0
  normalize: anchor
  num_classes: 7
  points: 1024
  pos_blocks:
  - 1
  - 1
  - 2
  - 1
  pre_blocks:
  - 1
  - 1
  - 2
  - 1
  reducers:
  - 2
  - 2
  - 2
  - 2
  res_expansion: 0.25
  use_xyz: false
npoints: 1024
optimizer:
  kwargs:
    lr: 0.0005
    weight_decay: 0.0001
  type: AdamW
scheduler:
  kwargs:
    initial_epochs: 10
  type: CosLR
step_per_update: 1
