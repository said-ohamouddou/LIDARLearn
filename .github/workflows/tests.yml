# CPU test suite on every push and pull request.
#
# GitHub-hosted runners have no GPU and no CUDA compiler, so the 7 CUDA
# extensions are not built here. Models that need one are reported as
# skipped (LIDARLEARN_ALLOW_MISSING_EXTENSIONS=1); GPU forward passes are
# skipped by the `gpu` marker. Everything else runs: config parsing, model
# builds, optional-import handling and checkpoint loading. Run the full
# GPU suite locally before releases (see README, "Verify the install").

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: torch ${{ matrix.torch }} (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: "2.4.1"   # reference setup (paper results)
            torchvision: "0.19.1"
          - torch: "2.8.0"   # newer PyTorch
            torchvision: "0.23.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries for open3d
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgomp1

      - name: Install PyTorch ${{ matrix.torch }} (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${{ matrix.torch }}" "torchvision==${{ matrix.torchvision }}" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch-scatter / torch-cluster (CPU wheels)
        run: |
          pip install torch-scatter torch-cluster \
            -f "https://data.pyg.org/whl/torch-${{ matrix.torch }}+cpu.html"

      - name: Install requirements
        run: pip install -r requirements.txt pytest

      - name: Show environment
        run: |
          python -c "import torch, numpy, torch_scatter, torch_cluster; print('torch', torch.__version__, '| numpy', numpy.__version__, '| scatter', torch_scatter.__version__, '| cluster', torch_cluster.__version__)"

      - name: Check install_extensions.sh syntax
        run: bash -n extensions/install_extensions.sh

      - name: Run tests
        env:
          LIDARLEARN_ALLOW_MISSING_EXTENSIONS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests/ -q -rs -p no:cacheprovider
